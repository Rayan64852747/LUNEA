<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Lunéa · Administration</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0d0d11;--panel2:#16161c;--line:#26262e;--ink:#f4f1f6;--muted:#9b94a8;--pink:#DF759E;--pink2:#E9A3CF;--plum:#51376F;--err:#ff7a7a;--ok:#4cd6a0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:14.5px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:600 13.5px Inter,system-ui,sans-serif;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 14px;min-height:40px;transition:background .2s,border-color .2s,transform .1s}
button:hover{border-color:#3a3a45}button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pink2);outline-offset:2px}
button:disabled{opacity:.6;cursor:default}
.pri{background:linear-gradient(135deg,var(--pink),#a54f86);border-color:transparent;color:#1a0b14}
.dng{color:var(--err);border-color:#4a2327;background:transparent}
input,textarea{font:16px Inter,system-ui,sans-serif;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#09090c;color:var(--ink)}
input::placeholder,textarea::placeholder{color:#6c6678}
textarea{min-height:120px;resize:vertical;margin-bottom:12px}
code{word-break:break-all;color:var(--pink2)}
.muted{color:var(--muted);font-size:13px}
/* écran de chargement */
#boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000;transition:opacity .6s ease,visibility 0s .6s}
#boot.out{opacity:0;visibility:hidden;pointer-events:none}
#boot::before{content:"";position:absolute;width:140vmin;height:140vmin;background:radial-gradient(circle,rgba(223,117,158,.22) 0%,rgba(81,55,111,.18) 32%,transparent 62%);animation:breathe 4s ease-in-out infinite alternate}
.lk{position:relative;width:clamp(120px,32vw,150px);aspect-ratio:120/110;margin-bottom:34px}
.lk svg.p{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:pop .8s cubic-bezier(.2,.8,.2,1) forwards}
.lk .t{--r:-4deg;animation-delay:.2s}.lk .l{--r:10deg;animation-delay:.55s}.lk .r{--r:-10deg;animation-delay:.9s}
.ring{position:absolute;left:-30%;top:-34%;width:160%;height:160%;animation:spin 2.2s linear infinite}
.word{position:relative;font:600 clamp(52px,15vw,68px)/1 "Cormorant Garamond",Georgia,serif;color:#FFF1F4;opacity:0;animation:fade 1s ease 1.1s forwards}
.sub{position:relative;letter-spacing:.28em;text-transform:uppercase;font-size:11.5px;color:var(--muted);opacity:0;animation:fade 1s ease 1.4s forwards}
.track{position:relative;width:170px;height:3px;margin-top:22px;border-radius:3px;background:#1f1f26;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;width:45%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--pink),var(--pink2),transparent);animation:slide 1.3s ease-in-out infinite}
#bootmsg{position:relative;margin:2px 0 0;font-size:12.5px;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:scale(.55) rotate(var(--r))}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{from{left:-45%}to{left:100%}}
@keyframes breathe{from{opacity:.55;transform:scale(1)}to{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){#boot::before,.ring,.track i{animation:none}.lk svg.p,.word,.sub{animation:none;opacity:1}}
/* connexion */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 20px 60px rgba(223,117,158,.07)}
.box .mk{width:64px;display:block;margin:0 auto 14px}
.box h1{font:600 30px/1.1 "Cormorant Garamond",Georgia,serif;margin:0;text-align:center}
.box .lead{text-align:center;margin:6px 0 22px}
.box label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;letter-spacing:.03em}
.fld{margin-bottom:14px}
.pw{position:relative}.pw input{padding-right:96px}
.pw button{position:absolute;right:5px;top:5px;min-height:34px;padding:0 12px;background:transparent;border:0;color:var(--pink2);font-size:12.5px}
#lerr{min-height:20px;margin:10px 0 0;color:var(--err);font-size:13px;text-align:center}
.foot{margin:18px 0 0;text-align:center;font-size:12px;color:#6c6678}
/* application */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 14px;background:var(--panel);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:34px;flex:none}
.brand b{font:600 24px/1 "Cormorant Garamond",Georgia,serif}
.brand small{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#tabs{display:flex;flex-direction:column;gap:4px}
#tabs button{text-align:left;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:500}
#tabs button:hover{background:var(--panel2);color:var(--ink)}
#tabs button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 3px 0 0 var(--pink)}
.me{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me small{color:var(--muted);word-break:break-all;padding:0 6px}
.main{padding:30px clamp(16px,4vw,44px) 60px;max-width:1040px;width:100%}
.main h2{font:600 32px/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 20px}
h3{margin:26px 0 10px;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
.grid .card{margin:0}
.stat b{display:block;font:600 34px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--pink2)}
.stat span{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600}
.tag.bad{background:#3a1519;border-color:#5a2227;color:var(--err)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.msgs{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.msg{padding:10px 0;border-bottom:1px dashed var(--line)}
.msg p{margin:3px 0;word-break:break-word}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bar span:first-child{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bar i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--plum),var(--pink))}
.bar b{margin-left:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f4f1f6;color:#111;padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#toast.on{opacity:1}
@media (max-width:820px){
 .shell{grid-template-columns:1fr}
 .side{height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);z-index:5}
 .brand{order:1;flex:1}.me{order:2;margin:0;flex-direction:row}.me small{display:none}
 #tabs{order:3;width:100%;flex-direction:row;overflow-x:auto;gap:6px}
 #tabs button{white-space:nowrap;flex:none;border-radius:20px;padding:8px 14px}
 #tabs button[aria-pressed="true"]{box-shadow:none;background:linear-gradient(135deg,var(--pink),#a54f86);color:#1a0b14}
 .main{padding-top:22px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9A0B8"/><stop offset="1" stop-color="#E0608C"/></linearGradient>
<linearGradient id="gL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6F8"/><stop offset="1" stop-color="#F4A9C0"/></linearGradient>
<linearGradient id="gR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6F8"/><stop offset="1" stop-color="#F4A9C0"/></linearGradient>
<linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9A3CF"/><stop offset="1" stop-color="#DF759E"/></linearGradient>
<symbol id="pt" viewBox="0 0 120 110"><path d="M60 64C40 50 38 24 56 6C74 20 78 46 60 64Z" fill="url(#gT)"/></symbol>
<symbol id="pl" viewBox="0 0 120 110"><path d="M58 72C34 72 12 58 6 38C30 36 52 46 58 72Z" fill="url(#gL)"/></symbol>
<symbol id="pr" viewBox="0 0 120 110"><path d="M62 72C86 72 108 58 114 38C90 36 68 46 62 72Z" fill="url(#gR)"/></symbol>
</defs></svg>

<div id="boot" role="status" aria-live="polite">
  <div class="lk">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#25252d" stroke-width="1"/><circle cx="50" cy="50" r="46" fill="none" stroke="url(#gA)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="70 220"/></svg>
    <svg class="p t" viewBox="0 0 120 110" aria-hidden="true"><use href="#pt"/></svg>
    <svg class="p l" viewBox="0 0 120 110" aria-hidden="true"><use href="#pl"/></svg>
    <svg class="p r" viewBox="0 0 120 110" aria-hidden="true"><use href="#pr"/></svg>
  </div>
  <div class="word">Lunéa</div>
  <div class="sub">Console d’administration</div>
  <div class="track" aria-hidden="true"><i></i></div>
  <p id="bootmsg">Chargement…</p>
</div>

<section id="login" class="center" hidden>
  <div class="box">
    <svg class="mk" viewBox="0 0 120 110" aria-hidden="true"><use href="#pt"/><use href="#pl"/><use href="#pr"/></svg>
    <h1>Lunéa</h1>
    <p class="muted lead">Connexion à la console d’administration</p>
    <form id="lf">
      <div class="fld"><label for="em">Adresse e-mail</label><input id="em" type="email" placeholder="prenom@exemple.com" autocomplete="username" required></div>
      <div class="fld"><label for="pw">Mot de passe</label><div class="pw"><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required><button id="pwt" type="button">Afficher</button></div></div>
      <button id="lgo" class="pri" style="width:100%;min-height:46px" type="submit">Se connecter</button>
    </form>
    <p id="lerr" role="alert"></p>
    <p class="foot">Accès réservé à l’équipe LUNÉA</p>
  </div>
</section>

<section id="denied" class="center" hidden>
  <div class="box">
    <h1>Accès refusé</h1>
    <p class="muted lead">Ce compte n’est pas administrateur. Pour l’autoriser, crée dans Firestore un document <code>admins/<span id="myuid"></span></code>.</p>
    <button id="out1" style="width:100%">Se déconnecter</button>
  </div>
</section>

<section id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 120 110" aria-hidden="true"><use href="#pt"/><use href="#pl"/><use href="#pr"/></svg><div><b>Lunéa</b><small>Administration</small></div></div>
    <nav id="tabs">
      <button data-v="home" aria-pressed="true">Vue d’ensemble</button>
      <button data-v="acc" aria-pressed="false">Comptes</button>
      <button data-v="rep" aria-pressed="false">Signalements</button>
      <button data-v="com" aria-pressed="false">Communauté</button>
      <button data-v="mem" aria-pressed="false">Membres</button>
      <button data-v="an" aria-pressed="false">Annonce</button>
    </nav>
    <div class="me"><small id="who"></small><button id="out2">Déconnexion</button></div>
  </aside>
  <div class="main"><h2 id="ttl"></h2><main id="view"></main></div>
</section>
<div id="toast" role="status"></div>

<script type="module">
const CFG={apiKey:"AIzaSyAEY9LiSBcHYHvXAONdQ2LRnd7Ssl4-LZ8",authDomain:"lunea-8d3e5.firebaseapp.com",projectId:"lunea-8d3e5",storageBucket:"lunea-8d3e5.firebasestorage.app",messagingSenderId:"95719046131",appId:"1:95719046131:web:b81a1d810e73d1e9aab086"};
const B="https://www.gstatic.com/firebasejs/12.19.0/";
const [AP,A,F]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
const app=AP.initializeApp(CFG);
try{const AC=await import(B+"firebase-app-check.js");AC.initializeAppCheck(app,{provider:new AC.ReCaptchaEnterpriseProvider("6LcuGfctAAAAAEMSsf6QPT5bs3OVesLjNbwGNmJw"),isTokenAutoRefreshEnabled:true})}catch(e){}
const auth=A.getAuth(app),db=F.getFirestore(app);
const $=id=>document.getElementById(id);
const t0=Date.now();
const hideBoot=()=>setTimeout(()=>$("boot").classList.add("out"),Math.max(0,1900-(Date.now()-t0)));
setTimeout(()=>{if(!$("boot").classList.contains("out"))$("bootmsg").textContent="Connexion lente… vérifie ta connexion internet."},10000);
const show=id=>{["login","denied","app"].forEach(x=>$(x).hidden=x!==id);hideBoot()};
const TT={home:"Vue d’ensemble",acc:"Comptes",rep:"Signalements",com:"Communauté",mem:"Membres",an:"Annonce"};
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const btn=(txt,cls,fn)=>{const b=el("button",cls,txt);b.type="button";b.onclick=fn;return b};
const when=t=>t&&t.toDate?t.toDate().toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"";
const WHY={closed:"Fermé",phone:"Numéro faux",place:"Mauvais endroit",other:"Autre"};
const list=async(path,field,n)=>(await F.getDocs(F.query(F.collection(db,...path.split("/")),F.orderBy(field,"desc"),F.limit(n)))).docs;
const count=async p=>{try{return (await F.getCountFromServer(F.collection(db,p))).data().count}catch(e){return "–"}};
const V=$("view");
let view="home";

$("pwt").onclick=()=>{const p=$("pw"),h=p.type==="password";p.type=h?"text":"password";$("pwt").textContent=h?"Masquer":"Afficher"};
$("lf").addEventListener("submit",async e=>{e.preventDefault();$("lerr").textContent="";const b=$("lgo");b.disabled=true;b.textContent="Connexion…";
  try{await A.signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(err){const c=err&&err.code||"";$("lerr").textContent=c.includes("too-many")?"Trop de tentatives. Réessaie dans quelques minutes.":c.includes("network")?"Pas de connexion internet.":"Adresse e-mail ou mot de passe incorrect."}
  b.disabled=false;b.textContent="Se connecter"});
$("out1").onclick=$("out2").onclick=()=>A.signOut(auth);

A.onAuthStateChanged(auth,async u=>{
  if(!u){show("login");return}
  let ok=false;
  try{ok=(await F.getDoc(F.doc(db,"admins",u.uid))).exists()}catch(e){}
  if(!ok){$("myuid").textContent=u.uid;show("denied");return}
  $("who").textContent=u.email||"";show("app");go(view);
});

$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)});
function go(v){view=v;$("ttl").textContent=TT[v];[...$("tabs").children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
  V.replaceChildren(el("p","muted","Chargement…"));
  ({home:rHome,acc:rAcc,rep:rRep,com:rCom,mem:rMem,an:rAn})[v]().catch(err=>{V.replaceChildren(el("p","muted","Erreur : "+(err.code||err.message)))})}

const sq=(...w)=>F.getCountFromServer(F.query(F.collection(db,"stats"),...w)).then(r=>r.data().count,()=>null);
const since=days=>sq(F.where("t",">=",F.Timestamp.fromDate(new Date(Date.now()-days*864e5))));
const stat=(g,l,v)=>{const c=el("div","card stat");c.append(el("b","",v==null?"–":v),el("span","muted",l));g.append(c)};
async function rHome(){
  const [g,r,m,u,a1,a7,a30,cy,pr,pp,n7]=await Promise.all([count("groups"),count("reports"),count("pub"),count("stats"),since(1),since(7),since(30),
    sq(F.where("m","==","cycle")),sq(F.where("m","==","preg")),sq(F.where("m","==","pp")),sq(F.where("c",">=",F.Timestamp.fromDate(new Date(Date.now()-7*864e5))))]);
  const g1=el("div","grid"),g2=el("div","grid"),g3=el("div","grid"),g4=el("div","grid");
  stat(g1,"Personnes inscrites",u);stat(g1,"Nouvelles sur 7 jours",n7);
  stat(g2,"Actives aujourd’hui",a1);stat(g2,"Actives sur 7 jours",a7);stat(g2,"Actives sur 30 jours",a30);
  stat(g2,"Inactives depuis plus de 30 jours",(typeof u==="number"&&a30!=null)?u-a30:null);
  stat(g3,"Suivi du cycle",cy);stat(g3,"Grossesse",pr);stat(g3,"Post-partum",pp);
  stat(g4,"Groupes",g);stat(g4,"Signalements en attente",r);stat(g4,"Profils publics",m);
  const extra=await growth();
  V.replaceChildren(g1,g2,el("h3","","Selon le mode utilisé"),g3,el("h3","","Nouvelles inscriptions par semaine"),extra.weeks,el("h3","","Pays"),extra.countries,el("h3","","Communauté"),g4,
    el("p","muted","Les chiffres viennent d’un petit document anonyme (mode, pays, dates) que l’application enregistre une fois par jour. Une personne apparaît dès qu’elle ouvre la nouvelle version de l’application. Active = a ouvert ou sauvegardé récemment. Aucune donnée de santé n’est lue."))}

const bars=rows=>{const c=el("div","card"),mx=Math.max(1,...rows.map(r=>r[1]));
  if(!rows.length)c.append(el("p","muted","Pas encore de données."));
  rows.forEach(([l,v])=>{const r=el("div","bar"),i=el("i");i.style.width=Math.max(2,Math.round(v/mx*55))+"%";r.append(el("span","",l),i,el("b","",v));c.append(r)});return c};
let RN;try{RN=new Intl.DisplayNames(["fr"],{type:"region"})}catch(e){}
const cname=c=>{if(!c)return "Non renseigné";try{return RN?RN.of(String(c).toUpperCase()):c}catch(e){return c}};
async function growth(){
  let docs=[];try{docs=(await F.getDocs(F.query(F.collection(db,"stats"),F.limit(5000)))).docs.map(d=>d.data())}catch(e){}
  const now=Date.now(),W=7*864e5,wk=[];
  for(let i=7;i>=0;i--){const a=now-(i+1)*W,b=now-i*W;
    wk.push([new Date(a).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}),docs.filter(x=>x.c&&x.c.toMillis&&x.c.toMillis()>=a&&x.c.toMillis()<b).length])}
  const cc={};docs.forEach(x=>{const k=x.ct||"";cc[k]=(cc[k]||0)+1});
  const top=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>[cname(k),v]);
  return{weeks:bars(wk),countries:bars(top)}}

const MODE={cycle:"Cycle",preg:"Grossesse",pp:"Post-partum"};
async function rAcc(){
  const total=await count("stats");
  const head=el("div","card"),lst=el("div"),more=el("div","acts");
  head.append(el("b","","Comptes connus : "+total),el("p","muted","Un compte apparaît ici dès qu’il a ouvert l’application connecté. Pour voir les adresses e-mail, ouvre Firebase, Authentication, Utilisateurs, et cherche l’identifiant copié ici."));
  V.replaceChildren(head,lst,more);
  let last=null,n=0;
  const load=async()=>{
    const q=F.query(F.collection(db,"stats"),F.orderBy("t","desc"),...(last?[F.startAfter(last)]:[]),F.limit(50));
    const docs=(await F.getDocs(q)).docs;
    docs.forEach(d=>{const x=d.data(),c=el("div","card"),r=el("div","row"),l=el("div");n++;
      l.append(el("b","",n+". "+(MODE[x.m]||"–")+" · "+cname(x.ct)),el("br"),
        el("span","muted","Inscrite : "+(when(x.c)||"avant le suivi")+" · Dernière activité : "+(when(x.t)||"–")),el("br"),
        el("code","",d.id));
      r.append(l,btn("Copier l’identifiant","",async()=>{try{await navigator.clipboard.writeText(d.id);toast("Identifiant copié")}catch(e){toast("Copie impossible")}}));
      c.append(r);lst.append(c)});
    last=docs[docs.length-1]||last;
    more.replaceChildren();
    if(docs.length===50)more.append(btn("Voir les suivantes","",()=>load().catch(err=>toast("Erreur : "+(err.code||err.message)))));
    if(!n)lst.append(el("p","muted","Aucun compte pour l’instant."))};
  await load()}
async function rAn(){
  const ref=F.doc(db,"config","announcement"),cur=await F.getDoc(ref),x=cur.exists()?cur.data():{};
  const ta=el("textarea");ta.value=x.on?(x.x||""):"";ta.placeholder="Ex. : Une nouvelle fonction est arrivée dans LUNÉA !";ta.maxLength=300;
  const st=el("p","muted",x.on?"Une annonce est actuellement affichée dans l’application.":"Aucune annonce n’est affichée.");
  const a=el("div","acts");
  a.append(btn("Publier","pri",async()=>{const t=ta.value.trim();if(!t){toast("Écris un message d’abord");return}
      await F.setDoc(ref,{x:t,on:true,t:F.serverTimestamp()});st.textContent="Annonce publiée : elle apparaît à l’ouverture de l’application.";toast("Annonce publiée")}),
    btn("Retirer l’annonce","dng",async()=>{await F.setDoc(ref,{x:"",on:false,t:F.serverTimestamp()});ta.value="";st.textContent="Aucune annonce n’est affichée.";toast("Annonce retirée")}));
  const c=el("div","card");c.append(el("b","","Annonce à toutes les utilisatrices"),el("p","muted","Un bandeau s’affiche une fois en haut de l’application, avec une croix pour le fermer (300 caractères maximum)."),ta,a,st);
  V.replaceChildren(c)}

async function rRep(){
  const docs=await list("reports","t",100);
  V.replaceChildren();
  if(!docs.length){V.append(el("p","muted","Aucun signalement."));return}
  docs.forEach(d=>{const x=d.data(),c=el("div","card"),r=el("div","row");
    const l=el("div");l.append(el("b","",x.n||x.k||"(sans nom)"),el("br"),el("span","tag",WHY[x.why]||x.why||"Autre"),el("span","muted"," "+(x.ty||"")+" · "+when(x.t)));
    r.append(l,btn("Marquer comme traité","pri",async()=>{await F.deleteDoc(d.ref);c.remove();toast("Signalement traité")}));
    c.append(r);V.append(c)})}

async function rCom(){
  const docs=await list("groups","la",100);
  V.replaceChildren();
  if(!docs.length){V.append(el("p","muted","Aucun groupe."));return}
  docs.sort((a,b)=>(b.data().r||0)-(a.data().r||0));
  docs.forEach(d=>{const x=d.data(),c=el("div","card"),r=el("div","row"),l=el("div");
    l.append(el("b","",x.n||"Groupe"),el("br"),el("span","muted",(x.d||"")+" — par "+(x.ps||"?")+" · "+(x.mc||0)+" messages"));
    if(x.r)l.append(el("br"),el("span","tag bad",x.r+" signalement"+(x.r>1?"s":"")));
    const box=el("div","msgs");box.hidden=true;
    const a=el("div","acts");
    a.append(btn("Messages","",async()=>{box.hidden=!box.hidden;if(!box.hidden)await loadMsgs(d.ref,box)}),
      btn("Supprimer le groupe","dng",async()=>{if(!confirm("Supprimer ce groupe et tous ses messages ?"))return;
        const ms=await F.getDocs(F.collection(d.ref,"msg"));
        for(let i=0;i<ms.docs.length;i+=400){const w=F.writeBatch(db);ms.docs.slice(i,i+400).forEach(m=>w.delete(m.ref));await w.commit()}
        await F.deleteDoc(d.ref);c.remove();toast("Groupe supprimé")}));
    r.append(l,a);c.append(r,box);V.append(c)})}

async function loadMsgs(gref,box){
  box.replaceChildren(el("p","muted","Chargement…"));
  const ms=(await F.getDocs(F.query(F.collection(gref,"msg"),F.orderBy("t","desc"),F.limit(60)))).docs;
  box.replaceChildren();
  if(!ms.length){box.append(el("p","muted","Aucun message."));return}
  ms.forEach(m=>{const x=m.data(),e=el("div","msg"),h=el("div","row");
    h.append(el("span","muted",(x.ps||"?")+" · "+when(x.t)),btn("Supprimer","dng",async()=>{await F.deleteDoc(m.ref);e.remove();toast("Message supprimé")}));
    e.append(h,el("p","",x.x||""));
    if(x.r)e.append(el("span","tag bad",x.r+" signalement"+(x.r>1?"s":"")));
    box.append(e)})}

async function rMem(){
  const docs=await list("pub","pts",100);
  V.replaceChildren();
  if(!docs.length){V.append(el("p","muted","Aucun profil public."));return}
  docs.forEach(d=>{const x=d.data(),c=el("div","card"),r=el("div","row");
    r.append(el("b","",x.ps||"(sans pseudo)"),el("span","muted",(x.pts||0)+" points · code "+(x.code||"–")));
    c.append(r);V.append(c)})}
</script>
